# Fly.io deployment config for the LenguaLive bot-worker.
# Deploy with:  fly launch --no-deploy   (first time, to create the app)
#               fly secrets set WORKER_API_TOKEN=... DEEPGRAM_API_KEY=... ANTHROPIC_API_KEY=...
#               fly deploy
#
# This runs ONE always-on machine. Each machine handles one meeting bot
# at a time in this MVP — scaling to concurrent meetings means running
# more machines (see ARCHITECTURE.md → "Scaling").

app = 'lengualive-bot-worker'
primary_region = 'sin'
kill_signal = 'SIGTERM'
kill_timeout = '2m0s'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the machine alive — a meeting bot must not be stopped mid-call.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # Chromium + audio stack is memory-hungry; start here and adjust.
  size = 'shared-cpu-2x'
  memory = '2gb'

# Persistent storage for the bot's Google session. Google rotates the
# anti-replay cookies (__Secure-3PSIDTS, *SIDCC) within minutes; a
# frozen GOOGLE_COOKIES_B64 export goes stale almost immediately. We
# write the rotated cookies here after each successful join so the
# next bot run starts from fresh server-blessed cookies.
[[mounts]]
  source = 'lengualive_data'
  destination = '/data'